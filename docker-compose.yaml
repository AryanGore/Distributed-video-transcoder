services:
  postgres:
    image: postgres:17
    container_name: transcoder-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: transcoder
      POSTGRES_USER: transcoder_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro

volumes:
  postgres_data: